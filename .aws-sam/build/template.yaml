AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'AgentPay Receptionist: an AI front desk and x402-paid local business
  API on AWS. CloudFront and AWS WAF route paid /api/paid/** actions through Lambda@Edge
  x402 verification before the origin API creates leads in DynamoDB.

  '
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
    - x86_64
Parameters:
  PayToAddress:
    Type: String
    Description: Ethereum wallet address that receives USDC payments
    AllowedPattern: ^0x[0-9a-fA-F]{40}$
    ConstraintDescription: Must be a valid Ethereum address
  Network:
    Type: String
    Description: x402 settlement network
    Default: eip155:84532
    AllowedValues:
    - eip155:84532
    - eip155:8453
  FacilitatorType:
    Type: String
    Description: x402.org is fastest for Base Sepolia demos; cdp is the Coinbase production
      path
    Default: x402.org
    AllowedValues:
    - x402.org
    - cdp
  CdpApiKeyName:
    Type: String
    Description: CDP API key name, required only when FacilitatorType is cdp
    Default: ''
  CdpApiKeyPrivateKey:
    Type: String
    NoEcho: true
    Description: CDP API private key, required only when FacilitatorType is cdp
    Default: ''
  RouteConfigJson:
    Type: String
    Description: Route pricing config stored in SSM and synced into AWS WAF
    Default: '{"version":"2","routes":[{"pattern":"/api/paid/hold-slot","policies":[{"condition":"default","action":"0.50"}]},{"pattern":"/api/paid/quote-request","policies":[{"condition":"default","action":"1.00"}]},{"pattern":"/api/paid/priority-callback","policies":[{"condition":"default","action":"2.00"}]},{"pattern":"/api/paid/**","policies":[{"condition":"default","action":"0.50"}]},{"pattern":"/api/agent/business-profile","policies":[{"condition":"default","action":"0"}]},{"pattern":"/api/chat","policies":[{"condition":"default","action":"0"}]},{"pattern":"/api/dashboard/**","policies":[{"condition":"default","action":"0"}]},{"pattern":"/api/health","policies":[{"condition":"default","action":"0"}]},{"pattern":"/api/**","policies":[{"condition":"default","action":"0"}]},{"pattern":"/**","policies":[{"condition":"default","action":"0"}]}]}

      '
Conditions:
  UseCdpFacilitator:
    Fn::Equals:
    - Ref: FacilitatorType
    - cdp
Resources:
  StackEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description:
        Fn::Sub: ${AWS::StackName} encryption key
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowRoot
          Effect: Allow
          Principal:
            AWS:
              Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
          Action: kms:*
          Resource: '*'
        - Sid: AllowLogs
          Effect: Allow
          Principal:
            Service:
              Fn::Sub: logs.${AWS::Region}.amazonaws.com
          Action:
          - kms:Encrypt*
          - kms:Decrypt*
          - kms:ReEncrypt*
          - kms:GenerateDataKey*
          - kms:Describe*
          Resource: '*'
  AgentPayTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-agentpay
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  SsmRouteConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /x402-edge/${AWS::StackName}/config/routes
      Type: String
      Value:
        Ref: RouteConfigJson
  SsmPayToAddress:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /x402-edge/${AWS::StackName}/config/payto
      Type: String
      Value:
        Ref: PayToAddress
  SsmNetwork:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /x402-edge/${AWS::StackName}/config/network
      Type: String
      Value:
        Ref: Network
  SsmFacilitatorUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /x402-edge/${AWS::StackName}/config/facilitator-url
      Type: String
      Value:
        Fn::If:
        - UseCdpFacilitator
        - https://api.cdp.coinbase.com/platform/v2/x402
        - https://x402.org/facilitator
  CdpCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseCdpFacilitator
    Properties:
      Name:
        Fn::Sub: x402-edge/${AWS::StackName}/cdp-credentials
      SecretString:
        Fn::Sub: '{"apiKeyName":"${CdpApiKeyName}","apiKeyPrivateKey":"${CdpApiKeyPrivateKey}"}'
  LambdaEdgeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
            - edgelambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: edge-config-read
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ssm:GetParameter
            Resource:
              Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/x402-edge/${AWS::StackName}/config/*
          - Fn::If:
            - UseCdpFacilitator
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                Ref: CdpCredentialsSecret
            - Ref: AWS::NoValue
  OriginRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-origin-request
      Description: Lambda@Edge x402 payment verification for paid business actions
      Handler: handler.handler
      CodeUri: OriginRequestFunction
      Timeout: 30
      MemorySize: 512
      Role:
        Fn::GetAtt:
        - LambdaEdgeExecutionRole
        - Arn
      AutoPublishAlias: live
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - handler.ts
        External:
        - '@aws-sdk/*'
        Minify: true
        Target: es2024
      SamResourceId: OriginRequestFunction
  OriginResponseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-origin-response
      Description: Lambda@Edge x402 payment settlement after successful origin action
      Handler: handler.handler
      CodeUri: OriginResponseFunction
      Timeout: 30
      MemorySize: 512
      Role:
        Fn::GetAtt:
        - LambdaEdgeExecutionRole
        - Arn
      AutoPublishAlias: live
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - handler.ts
        External:
        - '@aws-sdk/*'
        Minify: true
        Target: es2024
      SamResourceId: OriginResponseFunction
  BusinessApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-business-api
      StageName: Prod
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: '''GET,POST,OPTIONS'''
        AllowHeaders: '''content-type,x-payment,x-payment-response,payment-signature'''
        AllowOrigin: '''*'''
  BusinessApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-business-api
      Description: Free receptionist endpoints and paid action origin handlers
      Handler: handler.handler
      CodeUri: BusinessApiFunction
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          AGENTPAY_TABLE_NAME:
            Ref: AgentPayTable
          PAY_TO_ADDRESS:
            Ref: PayToAddress
          X402_NETWORK:
            Ref: Network
          X402_FACILITATOR_URL:
            Fn::If:
            - UseCdpFacilitator
            - https://api.cdp.coinbase.com/platform/v2/x402
            - https://x402.org/facilitator
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AgentPayTable
      Events:
        ApiProxy:
          Type: Api
          Properties:
            RestApiId:
              Ref: BusinessApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - handler.ts
        External:
        - '@aws-sdk/*'
        Minify: true
        Target: es2024
      SamResourceId: BusinessApiFunction
  WafRuleGroup:
    Type: AWS::WAFv2::RuleGroup
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-route-rules
      Scope: CLOUDFRONT
      Capacity: 300
      Rules: []
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName:
          Fn::Sub: ${AWS::StackName}-route-rules
  WafWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-web-acl
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      Rules:
      - Name: AWSBotControl
        Priority: 0
        OverrideAction:
          Count: {}
        Statement:
          ManagedRuleGroupStatement:
            VendorName: AWS
            Name: AWSManagedRulesBotControlRuleSet
            ManagedRuleGroupConfigs:
            - AWSManagedRulesBotControlRuleSet:
                InspectionLevel: COMMON
        VisibilityConfig:
          SampledRequestsEnabled: true
          CloudWatchMetricsEnabled: true
          MetricName:
            Fn::Sub: ${AWS::StackName}-bot-control
      - Name: X402RouteRules
        Priority: 1
        OverrideAction:
          None: {}
        Statement:
          RuleGroupReferenceStatement:
            Arn:
              Fn::GetAtt:
              - WafRuleGroup
              - Arn
        VisibilityConfig:
          SampledRequestsEnabled: true
          CloudWatchMetricsEnabled: true
          MetricName:
            Fn::Sub: ${AWS::StackName}-x402-route-rules
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName:
          Fn::Sub: ${AWS::StackName}-web-acl
  WafSyncRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: waf-sync
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            - ssm:PutParameter
            Resource:
            - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/x402-edge/${AWS::StackName}/config/routes
            - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/x402-edge/${AWS::StackName}/sync/last-hash
          - Effect: Allow
            Action:
            - wafv2:GetRuleGroup
            - wafv2:UpdateRuleGroup
            Resource:
              Fn::GetAtt:
              - WafRuleGroup
              - Arn
  WafSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-waf-sync
      Description: Syncs SSM route pricing config into the AWS WAF rule group
      Handler: handler.handler
      CodeUri: WafSyncFunction
      Timeout: 60
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - WafSyncRole
        - Arn
      Environment:
        Variables:
          WAF_RULE_GROUP_NAME:
            Fn::Sub: ${AWS::StackName}-route-rules
          WAF_RULE_GROUP_ID:
            Fn::GetAtt:
            - WafRuleGroup
            - Id
          SSM_ROUTES_PATH:
            Fn::Sub: /x402-edge/${AWS::StackName}/config/routes
          SSM_HASH_PATH:
            Fn::Sub: /x402-edge/${AWS::StackName}/sync/last-hash
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - handler.ts
        External:
        - '@aws-sdk/*'
        Minify: true
        Target: es2024
      SamResourceId: WafSyncFunction
  WafSyncSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(5 minutes)
      Targets:
      - Id: WafSyncTarget
        Arn:
          Fn::GetAtt:
          - WafSyncFunction
          - Arn
  WafSyncSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WafSyncFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - WafSyncSchedule
        - Arn
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  CloudFrontOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Comment:
          Fn::Sub: ${AWS::StackName} AgentPay Receptionist
        WebACLId:
          Fn::GetAtt:
          - WafWebAcl
          - Arn
        DefaultRootObject: index.html
        Origins:
        - Id: FrontendOrigin
          DomainName:
            Fn::GetAtt:
            - FrontendBucket
            - RegionalDomainName
          S3OriginConfig:
            OriginAccessIdentity: ''
          OriginAccessControlId:
            Fn::GetAtt:
            - CloudFrontOac
            - Id
        - Id: BusinessApiOrigin
          DomainName:
            Fn::Sub: ${BusinessApi}.execute-api.${AWS::Region}.amazonaws.com
          OriginPath: /Prod
          CustomOriginConfig:
            HTTPSPort: 443
            OriginProtocolPolicy: https-only
            OriginSSLProtocols:
            - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD
          - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
        - PathPattern: /api/*
          TargetOriginId: BusinessApiOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          - PUT
          - POST
          - PATCH
          - DELETE
          CachedMethods:
          - GET
          - HEAD
          - OPTIONS
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          LambdaFunctionAssociations:
          - EventType: origin-request
            LambdaFunctionARN:
              Ref: OriginRequestFunction.Version
          - EventType: origin-response
            LambdaFunctionARN:
              Ref: OriginResponseFunction.Version
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${FrontendBucket.Arn}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
  StaticContentDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: upload-frontend
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:ListBucket
            Resource:
            - Fn::GetAtt:
              - FrontendBucket
              - Arn
            - Fn::Sub: ${FrontendBucket.Arn}/*
          - Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource:
              Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
  StaticContentDeployFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-static-deploy
      Description: Uploads frontend files to S3 and invalidates CloudFront
      Runtime: nodejs24.x
      Handler: index.handler
      CodeUri: StaticContentDeployFunction
      Timeout: 120
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - StaticContentDeployRole
        - Arn
      AutoPublishAlias: live
      Environment:
        Variables:
          BUCKET:
            Ref: FrontendBucket
          CF_DISTRIBUTION_ID:
            Ref: CloudFrontDistribution
    Metadata:
      BuildMethod: makefile
      SamResourceId: StaticContentDeployFunction
  StaticContentDeploy:
    Type: Custom::StaticContent
    DependsOn:
    - FrontendBucketPolicy
    Properties:
      ServiceToken:
        Fn::GetAtt:
        - StaticContentDeployFunction
        - Arn
      Version:
        Ref: StaticContentDeployFunction.Version
  BusinessApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-business-api
      RetentionInDays: 30
  OriginRequestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/us-east-1.${AWS::StackName}-origin-request
      RetentionInDays: 30
  OriginResponseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/us-east-1.${AWS::StackName}-origin-response
      RetentionInDays: 30
  WafSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-waf-sync
      RetentionInDays: 30
  X402Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName:
        Fn::Sub: agentpay-${AWS::StackName}
      DashboardBody:
        Fn::Sub: "{\n  \"widgets\": [\n    {\n      \"type\": \"log\",\n      \"x\"\
          : 0,\n      \"y\": 0,\n      \"width\": 24,\n      \"height\": 6,\n    \
          \  \"properties\": {\n        \"query\": \"SOURCE '/aws/lambda/us-east-1.${AWS::StackName}-origin-request'\
          \ | SOURCE '/aws/lambda/us-east-1.${AWS::StackName}-origin-response' | filter\
          \ event in ['payment-requested','verification','settlement'] | fields @timestamp,\
          \ event, path, price, network, result, error | sort @timestamp desc | limit\
          \ 50\",\n        \"region\": \"${AWS::Region}\",\n        \"title\": \"\
          x402 Payment Events\",\n        \"view\": \"table\"\n      }\n    }\n  ]\n\
          }\n"
Outputs:
  FrontendUrl:
    Description: CloudFront URL for the AgentPay demo
    Value:
      Fn::Sub: https://${CloudFrontDistribution.DomainName}/
  BusinessApiOriginUrl:
    Description: Direct API Gateway origin URL; judged traffic should use CloudFront
    Value:
      Fn::Sub: https://${BusinessApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  AgentPayTableName:
    Description: DynamoDB table for leads, paid actions, and payment events
    Value:
      Ref: AgentPayTable
  SsmRouteConfigPath:
    Description: SSM route pricing config path
    Value:
      Fn::Sub: /x402-edge/${AWS::StackName}/config/routes
  CloudWatchDashboardUrl:
    Description: CloudWatch x402 dashboard
    Value:
      Fn::Sub: https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=agentpay-${AWS::StackName}
